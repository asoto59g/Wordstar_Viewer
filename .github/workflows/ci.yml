name: Validate WordStar viewer

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile app.py wordstar_viewer.py
      - name: Smoke test parser
        run: |
          python -c "from wordstar_viewer import decode_bytes, render_html; sample=b'.LH 16\r\nA\x02bold\x02\x1aignored'; text=decode_bytes(sample); assert 'ignored' not in text; assert '<strong>bold</strong>' in render_html(text); assert '.LH 16' in text"